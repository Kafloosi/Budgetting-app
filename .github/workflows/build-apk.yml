name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgetting-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Budgetting App APK (latest)
          body: |
            Installable Android APK built from the latest app code.

            **Install:** download `app-release.apk` on your phone, open it, and allow
            installing from unknown sources when prompted.
          files: android/app/build/outputs/apk/release/app-release.apk
